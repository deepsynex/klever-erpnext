[supervisord]
nodaemon=true
user=frappe
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/log/supervisor/supervisord.pid

[program:nginx]
user=frappe
directory=/home/frappe/frappe-bench
command=/usr/local/bin/nginx-entrypoint.sh
environment=BACKEND="127.0.0.1:8000",SOCKETIO="127.0.0.1:9000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

[program:backend]
user=frappe
directory=/home/frappe/frappe-bench
command=/usr/local/bin/start.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5

[program:websocket]
user=frappe
directory=/home/frappe/frappe-bench
command=node /home/frappe/frappe-bench/apps/frappe/socketio.js
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5

[program:queue-short]
user=frappe
directory=/home/frappe/frappe-bench
command=/home/frappe/frappe-bench/env/bin/bench worker --queue short,default
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20

[program:queue-long]
user=frappe
directory=/home/frappe/frappe-bench
command=/home/frappe/frappe-bench/env/bin/bench worker --queue long,default,short
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20

[program:scheduler]
user=frappe
directory=/home/frappe/frappe-bench
command=/home/frappe/frappe-bench/env/bin/bench schedule
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20
